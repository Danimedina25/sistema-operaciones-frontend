server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El HTML contiene los nombres versionados de los bundles. Debe validarse
    # en cada acceso para que un despliegue nuevo no siga cargando la app vieja.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }
}
